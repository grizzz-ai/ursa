name: Bug report
description: Report a reproducible installation, documentation, or compatibility problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include credentials, tokens, private keys, or private repository content.
        For a security vulnerability, do not open an Issue; follow the security policy instead.
  - type: textarea
    id: action
    attributes:
      label: What did you do?
      description: Include the command or workflow step and a minimal reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      description: For example, Codex, Claude Code, Git, or VS Code and the version shown by the client.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
    validations:
      required: true
